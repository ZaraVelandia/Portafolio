}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 60% at 51% 42%,transparent 35%,rgba(12,6,2,.55));
  transition:opacity 1s}
.zoomed .scene::after{opacity:.35}

/* Zona clicable del librero central */
.hotspot{
  position:absolute;left:calc(var(--px)*370);top:calc(var(--px)*40);
  width:calc(var(--px)*507);height:calc(var(--px)*480);
  background:none;border:0;padding:0;cursor:zoom-in;border-radius:calc(var(--px)*6);
  box-shadow:0 0 0 0 transparent;transition:box-shadow .4s,background .4s;
}
.hotspot:hover,.hotspot:focus-visible{background:rgba(243,207,134,.07);box-shadow:0 0 calc(var(--px)*40) calc(var(--px)*4) rgba(243,207,134,.25)}
.hotspot:focus-visible{outline:2px solid var(--glow);outline-offset:4px}
.zoomed .hotspot{display:none}

/* Título sobre el piso */
.title{
  position:absolute;left:0;right:0;top:calc(var(--px)*560);text-align:center;pointer-events:none;
  color:#f3e4c4;transition:opacity .6s;
  text-shadow:0 2px 12px rgba(0,0,0,.7);
}
.title h1{margin:0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:calc(var(--px)*44);line-height:1}
.title p{margin:calc(var(--px)*8) 0 0;font-style:italic;font-size:calc(var(--px)*17);opacity:.85}
.zoomed .title{opacity:0}

/* Libros del portafolio */
.book{
  position:absolute;z-index:2;
  width:calc(var(--px)*24);height:calc(var(--px)*74);
  padding:0;border:0;cursor:pointer;color:var(--gold);
  transform-origin:50% 100%;transform:rotate(var(--tilt,0deg));
  background:
    linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.14) 22%,rgba(255,255,255,.04) 50%,rgba(0,0,0,.35) 85%,rgba(0,0,0,.6)),
    var(--c);
  border-radius:calc(var(--px)*1.6) calc(var(--px)*1.6) calc(var(--px)*.8) calc(var(--px)*.8);
  box-shadow:calc(var(--px)*2) calc(var(--px)*1.5) calc(var(--px)*4) rgba(0,0,0,.7);
  opacity:0;pointer-events:none;
  transition:opacity .7s ease var(--d,0s),transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;
}
.zoomed.ready .book{opacity:1;pointer-events:auto}
.book::before,.book::after{content:"";position:absolute;left:12%;right:12%;height:calc(var(--px)*1.2);
  border-top:calc(var(--px)*.5) solid var(--gold);border-bottom:calc(var(--px)*.5) solid var(--gold);opacity:.85}
.book::before{top:calc(var(--px)*5)}.book::after{bottom:calc(var(--px)*5)}
.book span{
  position:absolute;top:calc(var(--px)*9);bottom:calc(var(--px)*9);left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;
  font-family:"IM Fell English",Georgia,serif;font-size:calc(var(--px)*7);line-height:1.08;
  text-shadow:0 1px 0 rgba(0,0,0,.6);
}
.book:hover,.book:focus-visible{transform:translateY(calc(var(--px)*-6)) rotate(0deg);filter:brightness(1.2)}
.book:focus-visible{outline:calc(var(--px)*1.2) solid var(--glow);outline-offset:calc(var(--px)*1.5)}
.book.pulling{transform:translateY(calc(var(--px)*-10)) scale(1.3);z-index:5;filter:brightness(1.3)}

/* Controles */
.controls{
  position:fixed;left:0;right:0;bottom:0;z-index:4;
  display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;
  padding:0 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);
  pointer-events:none;
}
.controls button,.hint{
  pointer-events:auto;font:inherit;font-size:1rem;
  color:var(--chip-ink);background:var(--chip);
  border:1px solid rgba(220,181,106,.45);border-radius:999px;padding:.55rem 1.1rem;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.controls button{cursor:pointer}
.controls button:hover{border-color:var(--gold)}
.controls button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hint{pointer-events:none;font-style:italic}
.controls [data-when]{display:none}
body:not(.zoomed) .controls [data-when="out"]{display:inline-block}
body.zoomed .controls [data-when="in"]{display:inline-block}
body.zoomed.narrow .controls [data-when="narrow"]{display:inline-block}

/* Vista del libro abierto */
.reader{position:fixed;inset:0;z-index:10;display:none;background:var(--veil);
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem);
  overflow-y:auto;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.reader.open{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spread{
  max-width:68rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;
  background:var(--paper);border-radius:4px;
  box-shadow:0 0 0 .5rem var(--accent),0 0 0 .6rem rgba(0,0,0,.4),0 40px 90px rgba(0,0,0,.6);
  animation:open .55s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%;
  position:relative;
}
@keyframes open{from{transform:perspective(1400px) rotateX(8deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
.spread::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3rem;margin-left:-1.5rem;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 45%,rgba(0,0,0,.28) 50%,rgba(0,0,0,.18) 55%,transparent);pointer-events:none}
.page{padding:3rem 3.25rem 3.5rem;min-width:0}
.page.left{border-right:1px solid var(--paper-edge)}
.back{
  font:inherit;font-size:.95rem;color:var(--ink-soft);background:none;border:0;padding:.25rem 0;cursor:pointer;
  border-bottom:1px solid var(--rule);
}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.reader h1{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,4.5vw,3.4rem);line-height:1.05;margin:2.25rem 0 1rem;text-wrap:balance}
.lede{font-size:1.2rem;line-height:1.6;color:var(--ink-soft);margin:0 0 1.5rem;max-width:34em}
.lede::first-letter{font-family:"IM Fell English",Georgia,serif;float:left;font-size:3.6em;line-height:.8;padding:.06em .1em 0 0;color:var(--accent-ink)}
.ornament{color:var(--accent-ink);font-size:1.4rem;text-align:center;margin:2rem 0 0;letter-spacing:.6em}
.page.right h2{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-weight:400;font-size:1.35rem;margin:0 0 1.25rem;color:var(--ink-soft)}
.entry{padding:1.1rem 0 1.25rem;border-top:1px solid var(--rule)}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.entry h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:1.45rem;margin:0;line-height:1.2}
.entry time{font-style:italic;color:var(--ink-soft);white-space:nowrap}
.entry p{margin:.45rem 0 0;line-height:1.65;font-size:1.05rem;max-width:36em}
.entry a{display:inline-block;margin-top:.5rem;color:var(--accent-ink);text-underline-offset:3px}
.tags{margin:.55rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.4rem}
.tags li{font-size:.85rem;padding:.1rem .55rem;border:1px solid var(--rule);border-radius:999px;color:var(--ink-soft)}
.folio{position:absolute;bottom:1.1rem;font-style:italic;color:var(--ink-soft);font-size:.9rem}
.page.left .folio{left:3.25rem}.page.right .folio{right:3.25rem}
.page{position:relative}
.shelfnav{display:flex;flex-wrap:wrap;gap:.35rem 1.1rem;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule)}
.shelfnav a{color:var(--ink-soft);text-decoration:none;font-size:.95rem}
.shelfnav a[aria-current]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.shelfnav a:hover{color:var(--ink)}

@media (max-width:820px){
  .spread{grid-template-columns:1fr;box-shadow:0 0 0 .35rem var(--accent),0 30px 60px rgba(0,0,0,.6)}
  .spread::before{display:none}
  .page{padding:2rem 1.5rem 3rem}
  .page.left{border-right:0;border-bottom:1px solid var(--paper-edge)}
  .page.left .folio{left:1.5rem}.page.right .folio{right:1.5rem}
  .reader h1{margin-top:1.5rem}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="viewport">
  <div class="scene" id="scene">
    <button class="hotspot" id="hotspot" aria-label="Acercarse al librero"></button>
    <div class="title"><h1>Biblioteca de Zara</h1><p>Literata y narradora digital</p></div>
  </div>
</div>

<div class="controls" role="toolbar" aria-label="Navegación de la biblioteca">
  <span class="hint" data-when="out">Toca el librero para acercarte</span>
  <button data-when="narrow" id="switch">Ver el otro librero</button>
  <button data-when="in" id="zoomout">Alejarse</button>
</div>

<section class="reader" id="reader" aria-modal="true" role="dialog" aria-labelledby="r-title">
  <article class="spread" id="spread"></article>
</section>

<script>
/* ==========================================================

  {

    intro:"Lo que aprendo por mi cuenta, fuera del aula: certificaciones que amplían mi oficio hacia los datos y el diseño gráfico, y los proyectos personales que hago por gusto.",

    proyectos:[
      {titulo:"Google Data Analytics Specialization", fecha:"2025", texto:"Certificado de Google en análisis de datos: limpieza, análisis y visualización de información para tomar decisiones.", etiquetas:["Google","Análisis de datos"]},
      {titulo:"Adobe Graphic Designer", fecha:"2025", texto:"Certificado de Adobe en diseño gráfico y manejo de sus herramientas de edición.", etiquetas:["Adobe","Diseño gráfico"]},
      {titulo:"Proyecto personal", fecha:"", texto:"Aquí puedes mostrar un texto, un proyecto visual o sonoro que hayas hecho por iniciativa propia.", etiquetas:["Por completar"]}
    ]
  },
  {
    id:"profesional", lomo:"Paso por lo profesional", color:"#1e2b48", tinta:"#34507f",
    intro:"Mi experiencia de trabajo en archivos digitales, redes sociales y comunicación cultural.",
    seccion:"Experiencia",
    proyectos:[
      {titulo:"Coordinadora de redes y página web · Cátedra de Estudios Portugueses Fernando Pessoa", fecha:"Ene. 2025 – hoy", texto:"Pasantía de medio tiempo con la Universidad de los Andes. Coordino las redes sociales y la página de la Cátedra.", etiquetas:["Redes sociales","Contenido web","Comunicación cultural"]},
      {titulo:"Practicante · Banco de Archivos Digitales de Artes en Colombia (BADAC)", fecha:"Ago. 2024 – may. 2025", texto:"Práctica profesional en el BADAC, trabajando con archivos digitales de artes en Colombia.", etiquetas:["Archivo digital","Artes"]}
    ]
  },
  {
    id:"futuro", lomo:"Paso por el futuro", color:"#7a5418", tinta:"#97661a",
    intro:"Lo que viene: llevar la literatura y la narración digital al terreno del diseño.",
    seccion:"Lo que viene",
    proyectos:[
      {titulo:"Maestría en Diseño", fecha:"2026", texto:"Estudiante activa de la maestría en Diseño en la Universidad de los Andes.", etiquetas:["En curso","Universidad de los Andes"]},
      {titulo:"Hacia dónde voy", fecha:"", texto:"Quiero unir escritura, diseño y datos para crear experiencias narrativas, archivos y contenidos culturales que conecten con sus públicos.", etiquetas:["Narrativa","Diseño","Cultura"]},
      {titulo:"Busco", fecha:"", texto:"Equipos y proyectos en comunicación, contenido editorial, archivos digitales y diseño de experiencias.", etiquetas:["Abierta a oportunidades"], enlace:"mailto:zaravesu.16@gmail.com", textoEnlace:"Escríbeme"}
    ]
  }
];

/* Medidas de la imagen (1200×673 px) */
const IW = 1200, IH = 673;
const REPISAS = [108, 190, 275, 354, 430, 506];          // base de cada repisa
const LIBREROS = [[384, 585], [630, 865]];                // interior de los dos libreros centrales
const LIBRO_W = 24, LIBRO_H = 74;
const ENCUADRE = { ambos:[370, 40, 507, 480], uno:[[374, 40, 220, 480],[620, 40, 255, 480]] };

const body = document.body;
const scene = document.getElementById("scene");
const reader = document.getElementById("reader");
const spread = document.getElementById("spread");
const rnd = (a,b) => a + Math.random()*(b-a);
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(p => p[1]);
const quiet = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

let zoomed = false, lado = 0, readyTimer;

/* ---------- Cámara ---------- */
function layout(){
  const vw = innerWidth, vh = innerHeight;
  const k = Math.max(vw/IW, vh/IH);
  scene.style.width = IW*k + "px";
  scene.style.height = IH*k + "px";
  const narrow = vw/vh < 1.05;
  body.classList.toggle("narrow", narrow);
  let tx, ty, s;
  if (!zoomed){
    s = 1; tx = (vw - IW*k)/2; ty = (vh - IH*k)/2;
  } else {
    const [x,y,w,h] = narrow ? ENCUADRE.uno[lado] : ENCUADRE.ambos;
    const reserva = 80; // espacio para los controles
    s = Math.min(vw/(w*k), (vh - reserva)/(h*k)) * .96;
    tx = vw/2 - (x + w/2)*k*s;
    ty = (vh - reserva)/2 - (y + h/2)*k*s + 8;
  }
  scene.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}

function acercar(){
  if (zoomed) return;
  zoomed = true; body.classList.add("zoomed");
  layout();
  clearTimeout(readyTimer);
  readyTimer = setTimeout(() => {
    body.classList.add("ready");
    const primero = visibles()[0]; primero && primero.focus({preventScroll:true});
  }, quiet() ? 0 : 1050);
}
function alejar(){
  zoomed = false; clearTimeout(readyTimer);
  body.classList.remove("zoomed","ready");
  layout();
  document.getElementById("hotspot").focus({preventScroll:true});
}
function visibles(){
  const libros = [...scene.querySelectorAll(".book")];
  return body.classList.contains("narrow") ? libros.filter(b => +b.dataset.lado === lado) : libros;
}

/* ---------- Libros en posiciones aleatorias ---------- */
function colocarLibros(){
  const filas = shuffle([0,1,2,3,4,5]).slice(0,5);
  const lados = shuffle(Math.random() < .5 ? [0,0,0,1,1] : [0,0,1,1,1]);
  shuffle(LIBROS).forEach((libro, i) => {
    const [x0, x1] = LIBREROS[lados[i]];
    const x = rnd(x0 + 4, x1 - LIBRO_W - 4);
    const base = REPISAS[filas[i]];
    const b = document.createElement("button");
    b.className = "book";
    b.dataset.id = libro.id;
    b.dataset.lado = lados[i];
    b.style.setProperty("--c", libro.color);
    b.style.setProperty("--d", (i*0.09).toFixed(2) + "s");
    const t = Math.random();
    b.style.setProperty("--tilt", t < .2 ? "-6deg" : t > .85 ? "5deg" : "0deg");
    b.style.left = `calc(var(--px) * ${x.toFixed(1)})`;
    b.style.top = `calc(var(--px) * ${(base - LIBRO_H).toFixed(1)})`;
    b.innerHTML = "<span>" + libro.lomo + "</span>";
    b.setAttribute("aria-label", "Abrir " + libro.lomo);
    b.addEventListener("click", () => {
      b.classList.add("pulling");
      setTimeout(() => { location.hash = libro.id; b.classList.remove("pulling"); }, quiet() ? 0 : 320);
    });
    scene.appendChild(b);
  });
}

/* ---------- Libro abierto ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function abrir(libro){
  const n = LIBROS.indexOf(libro);
  spread.style.setProperty("--accent", libro.color);
  spread.style.setProperty("--accent-ink", libro.tinta);
  const entradas = libro.proyectos.map(p => `
    <section class="entry">
      <header><h3>${esc(p.titulo)}</h3>${p.fecha ? `<time>${esc(p.fecha)}</time>` : ""}</header>
      <p>${esc(p.texto)}</p>
      ${p.etiquetas && p.etiquetas.length ? `<ul class="tags">${p.etiquetas.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      ${p.enlace ? `<a href="${esc(p.enlace)}" target="_blank" rel="noopener">${esc(p.textoEnlace || "Ver más")}</a>` : ""}
    </section>`).join("");
  const nav = LIBROS.map(l => `<a href="#${l.id}" ${l === libro ? 'aria-current="page"' : ""}>${esc(l.lomo)}</a>`).join("");
  spread.innerHTML = `
    <div class="page left">
      <button class="back" id="back">Volver a la biblioteca</button>
      <h1 id="r-title">${esc(libro.lomo)}</h1>
      <p class="lede">${esc(libro.intro)}</p>
      <p class="ornament" aria-hidden="true">❦</p>
      <nav class="shelfnav" aria-label="Otros libros">${nav}</nav>
      <span class="folio">${2*n+1}</span>
    </div>
    <div class="page right">
      <h2>${esc(libro.seccion)}</h2>
      ${entradas}
      <span class="folio">${2*n+2}</span>
    </div>`;
  spread.style.animation = "none"; void spread.offsetWidth; spread.style.animation = "";
  reader.classList.add("open");
  reader.scrollTop = 0;
  document.getElementById("back").addEventListener("click", cerrar);
  document.getElementById("back").focus({preventScroll:true});
}
function cerrar(){
  if (location.hash) location.hash = "";
  reader.classList.remove("open");
}
function ruta(){
  const libro = LIBROS.find(l => l.id === location.hash.slice(1));
  if (libro){
    // deja la biblioteca acercada detrás del libro, en el librero donde está
    const b = scene.querySelector(`.book[data-id="${libro.id}"]`);
    if (b) lado = +b.dataset.lado;
    if (!zoomed){ zoomed = true; body.classList.add("zoomed","ready"); layout(); }
    abrir(libro);
  } else {
    reader.classList.remove("open");
    const b = zoomed && visibles()[0]; b && b.focus({preventScroll:true});
  }
}

/* ---------- Eventos ---------- */
document.getElementById("hotspot").addEventListener("click", acercar);
document.getElementById("zoomout").addEventListener("click", alejar);
document.getElementById("switch").addEventListener("click", () => { lado = 1 - lado; layout(); });
reader.addEventListener("click", e => { if (e.target === reader) cerrar(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (reader.classList.contains("open")) cerrar();
  else if (zoomed) alejar();
});
addEventListener("resize", layout);
addEventListener("hashchange", ruta);

colocarLibros();
scene.style.transition = "none"; layout(); void scene.offsetWidth; scene.style.transition = "";
ruta();
</script>
